name: Publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - run: python3 scripts/validate_release.py --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  packages:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      packages: true
      ref: ${{ inputs.tag || github.ref_name }}
  publish:
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts/
      - name: Generate checksums
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          files = sorted(p for p in Path('artifacts').iterdir() if p.is_file())
          for suffix in ('.tar.gz', '.whl', '.deb', '.rpm', '.pkg.tar.zst'):
              assert any(p.name.endswith(suffix) for p in files), f'Missing release asset: {suffix}'
          Path('artifacts/SHA256SUMS').write_text(''.join(
              f'{sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
      - name: Upload all assets before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bash scripts/publish_release.sh "$RELEASE_TAG" artifacts
