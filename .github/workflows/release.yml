name: Prepare draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.0
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - run: python3 scripts/validate_release.py --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
  packages:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      packages: true
      ref: ${{ inputs.tag }}
  draft:
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts/
      - name: Generate checksums
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          files = sorted(p for p in Path('artifacts').iterdir() if p.is_file())
          Path('artifacts/SHA256SUMS').write_text(''.join(
              f'{sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
      - name: Create draft for human review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mapfile -d '' files < <(find artifacts -maxdepth 1 -type f -print0)
          gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag --draft \
            --title "Plasma Shortcut Explorer $RELEASE_TAG" --notes-file CHANGELOG.md
