name: Tests and packages
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      packages:
        description: Build and test native packages
        type: boolean
        default: false
  workflow_call:
    inputs:
      packages:
        type: boolean
        default: false
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y dbus-daemon libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install -e '.[test]'
      - run: scripts/test.sh -q
      - run: python -m coverage html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ matrix.python }}
          path: htmlcov/
  source:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils
      - run: python scripts/configure_release.py --project-url "https://github.com/$GITHUB_REPOSITORY"
      - run: python scripts/validate_release.py
      - run: appstreamcli validate --no-net data/org.kde.shortcutexplorer.metainfo.xml
      - run: desktop-file-validate data/org.kde.shortcutexplorer.desktop
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-python
          path: |
            dist/*.tar.gz
            dist/*.whl
  native:
    if: inputs.packages == true
    needs: source
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [arch, deb, rpm]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-python
          path: dist/
      - run: scripts/build_native.sh "$PACKAGE_TARGET"
        env:
          KDE_SHORTCUTS_CONTAINER_ENGINE: docker
          PACKAGE_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.target }}
          path: dist/native/${{ matrix.target }}/
          include-hidden-files: true
